name: Profile

# Once a night, off the hour on purpose: everyone else's cron runs at minute zero.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  tonight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tonight's night
        run: cp "assets/nights/$(date -u +%a | tr '[:upper:]' '[:lower:]').svg" assets/night.svg

      - name: Latest writing
        run: python3 scripts/writing.py README.md 4

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/night.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: tonight's night"
          git push
